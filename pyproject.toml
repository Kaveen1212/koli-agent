[project]
name = "koli-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "boto3>=1.43.18",
    "cairosvg>=2.9.0",
    "langchain>=1.3.2",
    "langchain-core>=1.4.0",
    "langchain-google-genai>=4.2.4",
    "langgraph>=1.2.2",
    "pgvector>=0.4.2",
    "pillow>=12.2.0",
    "psycopg2>=2.9.12",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.30",
    "redis>=8.0.0",
    "rq>=2.9.0",
    "sqlalchemy>=2.0.50",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
markers = [
    "needs_gemini: calls the live Gemini API; skipped unless GEMINI_API_KEY is a real key",
]

# Lint: `ruff check .` (CI never runs --fix). Deliberately narrow: pyflakes
# errors plus the pycodestyle E4/E7/E9 checks. Style/import-order/upgrade rules
# are left off so enabling the linter does not demand a codebase-wide rewrite.
[tool.ruff]
extend-exclude = ["static"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# env.py loads .env before importing app code, and imports the models only so
# their tables register on Base.metadata (autogenerate).
"migrations/env.py" = ["E402", "F401"]
# Alembic's generated template imports sqlalchemy even when unused.
"migrations/versions/*.py" = ["F401"]
# Assigning a lambda to a local name in a test helper.
"tests/*.py" = ["E731"]
